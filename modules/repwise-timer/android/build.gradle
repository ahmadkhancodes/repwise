plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.repwisetimer'
version = '1.0.0'

android {
  namespace "expo.modules.repwisetimer"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // The "Rest over" alert is an expo-notifications request; the timer service delivers it on
  // time and the +15 s action moves it (ExpoRestAlert.kt).
  implementation project(':expo-notifications')
}
