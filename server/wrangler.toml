# Repwise API (Cloudflare Worker). No secrets in this file: use `wrangler secret put <NAME>`.
# See server/README.md for the full list of variables and secrets.
name = "repwise-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
JWT_ISSUER = "repwise-api"
JWT_AUDIENCE = "repwise-app"
MONGODB_DB = "repwise"
APPLE_BUNDLE_ID = "com.client.repwise"
PLAY_PACKAGE_NAME = "com.client.repwise"
PAYMENTS_ENABLED = "false"
AI_PROVIDER = "anthropic"
AI_MODEL = "claude-haiku-5-5"
AI_MONTHLY_BUDGET_USD = "50"
AI_TIMEOUT_MS = "8000"
MAIL_PROVIDER = "console"

[observability]
enabled = true
