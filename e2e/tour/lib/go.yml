# Tour helper: navigate by tapping TAP until the screen EXPECT shows (one retry), then ~2 s on it.
# EXPECT must be a screen-level id (always on screen once open), never a row below the fold.
# waitForAnimationToEnd before the tap: iOS taps during a slide-in are lost (owner QA, 23 Nov).
appId: com.client.repwise
---
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: ${TAP}
    direction: DOWN
    centerElement: true
    timeout: 6000
    optional: true
- tapOn:
    id: ${TAP}
    optional: true
- extendedWaitUntil:
    visible:
      id: ${EXPECT}
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: ${EXPECT}
    commands:
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: ${TAP}
          optional: true
      - extendedWaitUntil:
          visible:
            id: ${EXPECT}
          timeout: 20000
          optional: true
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "tour-pause"
    timeout: 1200
    optional: true
