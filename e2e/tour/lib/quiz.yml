# Tour helper: one onboarding step. Waits for screen-quiz-STEP, reads it, taps PICK (an option id;
# "none" taps nothing), then NEXT (quiz-next | quiz-skip | none for auto-advancing steps).
appId: com.client.repwise
---
- extendedWaitUntil:
    visible:
      id: screen-quiz-${STEP}
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "tour-pause"
    timeout: 1000
    optional: true
- runFlow:
    when:
      true: ${PICK !== 'none'}
    commands:
      - scrollUntilVisible:
          element:
            id: ${PICK}
          direction: DOWN
          centerElement: true
          timeout: 5000
          optional: true
      - tapOn:
          id: ${PICK}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 800
          optional: true
- runFlow:
    when:
      true: ${NEXT !== 'none'}
    commands:
      - tapOn:
          id: ${NEXT}
          optional: true
