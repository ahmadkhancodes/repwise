# Owner tour video (iOS, Dark Mode): one calm, natural walk through the whole app on a fresh
# install, recorded by .github/workflows/record-ios-tour.yml (simctl recordVideo around this flow).
#
# FAST tour (D-TOUR-FAST, ~3 min after post-process): US+UK cuisines, building-plan screen, onboarding paywall (4 plans, X), 2 sets, GIF hero + Muscles worked, a Pro gate → test checkout → Payment complete, Subscription. keep-start/keep-end marks protect the payment holds from speed-up.
# (brief, workout card, meal timeline) → workout (exercise detail, 3 sets, rest timer, finish) →
# Train (week strip, history) → Eat (rings, tick, swap, recipe, cook mode, week) → Progress
# (log weight, body, heatmap) → Library (muscle chip, exercise with muscle map) → weekly check-in
# (opened by its notification link) → assistant card if one fired → Settings (scrolled end to end)
# → paywall (shown, closed with its close button; never purchases) → back on Today.
#
# Runs ONLY when TOUR_RECORDING=true (maestro test -e TOUR_RECORDING=true …): scripts/ci/maestro-run.sh
# picks up every e2e/**/*.yaml, and there this flow is a no-op. It needs the local stub
# (e2e/tour/stub-server.mjs, STUB_URL) for the paywall step and the video trim marks; without it the
# paywall step is skipped. Pauses are optional waits on an id that never renders ("tour-pause").
# Selectors are the ones the E2E flows already use on iOS.
appId: com.client.repwise
name: iOS dark-mode full app tour (video)
tags:
  - tour
---
- runFlow:
    when:
      true: ${typeof TOUR_RECORDING !== 'undefined' && TOUR_RECORDING === 'true'}
    commands:
      # ---------- start: mark the video, first launch with notifications not yet decided ----------
      - launchApp:
          clearState: true
          permissions:
            notifications: unset

      - openLink: repwise://demo-payments?on=1&reset=1
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Open"
                optional: true
      # ---------- S02 Welcome ----------
      - extendedWaitUntil:
          visible:
            id: "screen-welcome"
          timeout: 60000
      # Mark the video start once the app is up (the reinstall before it shows the home screen for ~1 min).
      - runScript:
          file: stub.js
          env:
            STUB_URL: ${STUB_URL}
            ACTION: mark?name=start
      - waitForAnimationToEnd:
          timeout: 1000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          from:
            id: "welcome-carousel"
          direction: LEFT
          duration: 600
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          from:
            id: "welcome-carousel"
          direction: LEFT
          duration: 600
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "welcome-start"
          optional: true
      # The tap can be lost right after the carousel swipes: tap once more if the quiz did not open.
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-goal"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "screen-quiz-goal"
          commands:
            - tapOn:
                id: "welcome-start"
                optional: true

      # ---------- Quiz: goal (auto-advances) ----------
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-goal"
          timeout: 30000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-fat_loss"
          optional: true
      # about: sex + year of birth
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-about"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-male"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # body: height + weight wheels (prefilled)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-body"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # target weight (optional for fat loss): decide later
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-target"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-skip"
          optional: true
      # experience (auto-advances)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-experience"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-intermediate"
          optional: true
      # training days: 4 a week, spread from today
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-days"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "days-count-4"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # session length (auto-advances)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-length"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-60"
          optional: true
      # equipment: a full gym
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-equipment"
          timeout: 20000
      - tapOn:
          id: "option-gym"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # injuries: none
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-injuries"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-skip"
          optional: true
      # daily activity (auto-advances)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-activity"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-moderate"
          optional: true
      # diet (auto-advances)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-diet"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "option-omnivore"
          optional: true
      # foods to avoid: no mushrooms
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-avoid"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - scrollUntilVisible:
          element:
            id: "dislikes-mushrooms"
          direction: DOWN
          centerElement: true
          optional: true
      - tapOn:
          id: "dislikes-mushrooms"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # cuisines: a few favourites
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-cuisines"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "cuisines-american"
          optional: true
      - tapOn:
          id: "cuisines-british"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # kitchen: budget + cooking time (defaults)
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-kitchen"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true
      # meals per day → Build my plan
      - extendedWaitUntil:
          visible:
            id: "screen-quiz-meals"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "quiz-next"
          optional: true

      # ---------- S06 reminders primer → the real iOS permission dialog ----------
      - extendedWaitUntil:
          visible:
            id: "screen-notify"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "notify-allow"
          optional: true
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 6000
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
      # If the system dialog never showed (already decided), the primer may still be up.
      - runFlow:
          when:
            visible:
              id: "screen-notify"
          commands:
            - tapOn:
                id: "notify-later"
                optional: true

      # ---------- S07 plan build → W1 reveal ----------
      - extendedWaitUntil:
          visible:
            id: "screen-plan"
          timeout: 30000
      - extendedWaitUntil:
          visible:
            id: "reveal-targets"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 35%
          duration: 1400
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 35%
          duration: 1400
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "plan-continue"
          optional: true
      # Onboarding paywall (F1): all four plans, each price visible, then closed with X -> Free.
      - runScript:
          file: stub.js
          env:
            STUB_URL: ${STUB_URL}
            ACTION: mark?name=keep-start
      - extendedWaitUntil:
          visible:
            id: "screen-paywall"
          timeout: 15000
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-hold"
          timeout: 2500
          optional: true
      - tapOn:
          id: "plan-weekly"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-hold"
          timeout: 900
          optional: true
      - tapOn:
          id: "plan-monthly"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-hold"
          timeout: 900
          optional: true
      - tapOn:
          id: "plan-quarterly"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-hold"
          timeout: 900
          optional: true
      - tapOn:
          id: "plan-yearly"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-hold"
          timeout: 900
          optional: true
      - tapOn:
          id: "paywall-close"
          optional: true
      - runFlow:
          when:
            visible:
              id: "demo-checkout"
          commands:
            - tapOn:
                id: "demo-cancel"
            - tapOn:
                id: "paywall-close"
                optional: true
      - runScript:
          file: stub.js
          env:
            STUB_URL: ${STUB_URL}
            ACTION: mark?name=keep-end

      # ---------- S11 Today: brief, workout card, meal timeline ----------
      - extendedWaitUntil:
          visible:
            id: "screen-today"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 1300
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - scrollUntilVisible:
          element:
            id: "today-meals"
          direction: DOWN
          centerElement: true
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 1300
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - scrollUntilVisible:
          element:
            id: "start-workout"
          direction: UP
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true

      # ---------- S13 workout: start, exercise detail, 3 sets, rest timer, finish ----------
      - runFlow:
          when:
            visible:
              id: "start-workout"
          commands:
            - tapOn:
                id: "start-workout"
                optional: true
      - runFlow:
          # Rest day (no Start on Today): start from Train instead.
          when:
            notVisible:
              id: "screen-workout"
          commands:
            - tapOn:
                id: "tab-train"
                optional: true
            # Retry once if the next screen has not appeared (a lost tap must not end the video).
            - extendedWaitUntil:
                visible:
                  id: "train-start"
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  notVisible:
                    id: "train-start"
                commands:
                  - tapOn:
                      id: "tab-train"
                      optional: true
            - extendedWaitUntil:
                visible:
                  id: "train-start"
                timeout: 20000
            - tapOn:
                id: "train-start"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-workout"
          timeout: 20000
      - runFlow:
          when:
            visible:
              id: "player-start"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "player-start"
                optional: true
      - runFlow:
          # Empty workout (rest day): add an exercise from the bundled catalogue.
          when:
            visible:
              id: "player-empty"
          commands:
            - tapOn:
                id: "player-empty-action"
                optional: true
            - tapOn:
                id: "pick-search"
                optional: true
            - inputText: "bench press"
            - tapOn:
                id: "exercise-row-barbell-bench-press"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "player-clock"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      # The first exercise's detail (cues), then back to the player.
      - runFlow:
          when:
            visible:
              id: "exercise-0-open"
          commands:
            - tapOn:
                id: "exercise-0-open"
                optional: true
            # Retry once if the next screen has not appeared (a lost tap must not end the video).
            - extendedWaitUntil:
                visible:
                  id: "screen-exercise"
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  notVisible:
                    id: "screen-exercise"
                commands:
                  - tapOn:
                      id: "exercise-0-open"
                      optional: true
            - extendedWaitUntil:
                visible:
                  id: "screen-exercise"
                timeout: 20000
            - waitForAnimationToEnd:
                timeout: 1000
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - swipe:
                start: 50%, 70%
                end: 50%, 40%
                duration: 1300
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - runFlow:
                when:
                  visible:
                    id: "ex-back"
                commands:
                  - tapOn:
                      id: "ex-back"
                      optional: true
            - runFlow:
                when:
                  visible:
                    id: "exercise-back"
                commands:
                  - tapOn:
                      id: "exercise-back"
                      optional: true
            - runFlow:
                when:
                  visible:
                    id: "back"
                  notVisible:
                    id: "player-clock"
                commands:
                  - tapOn:
                      id: "back"
                      optional: true
            - extendedWaitUntil:
                visible:
                  id: "player-clock"
                timeout: 20000
      # Set 1: weight and reps with the stepper editor, then log.
      - runFlow:
          when:
            visible:
              id: "exercise-0-set-0-weight"
          commands:
            - tapOn:
                id: "exercise-0-set-0-weight"
                optional: true
            # Retry once if the next screen has not appeared (a lost tap must not end the video).
            - extendedWaitUntil:
                visible:
                  id: "set-editor-weight"
                timeout: 10000
                optional: true
            - runFlow:
                when:
                  notVisible:
                    id: "set-editor-weight"
                commands:
                  - tapOn:
                      id: "exercise-0-set-0-weight"
                      optional: true
            - extendedWaitUntil:
                visible:
                  id: "set-editor-weight"
                timeout: 20000
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "set-editor-weight-inc"
                optional: true
            - tapOn:
                id: "set-editor-weight-inc"
                optional: true
            - tapOn:
                id: "set-editor-reps-inc"
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "set-editor-log"
                optional: true
      - runFlow:
          when:
            visible:
              id: "player-log"
            notVisible:
              id: "rest-bar"
          commands:
            - tapOn:
                id: "player-log"
                optional: true
      # Rest timer: open the big timer, take 15 s off, skip. About 5 s per rest so the video never sits
      # through a real 2-minute rest. A ticking countdown never "settles", so every tap while a rest runs
      # uses a short settle wait (Maestro would otherwise wait many seconds per tap).
      - extendedWaitUntil:
          visible:
            id: "rest-bar"
          timeout: 20000
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "rest-bar-open"
          waitToSettleTimeoutMs: 400
          optional: true
      - extendedWaitUntil:
          visible:
            id: "rest-time"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-time"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "rest-minus"
                waitToSettleTimeoutMs: 400
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "rest-skip"
                waitToSettleTimeoutMs: 400
                optional: true
      # A lost Skip tap: try once more, then close the sheet; the rest bar is skipped below either way.
      - runFlow:
          when:
            visible:
              id: "rest-skip"
          commands:
            - tapOn:
                id: "rest-skip"
                waitToSettleTimeoutMs: 400
                optional: true
      - runFlow:
          when:
            visible:
              id: "rest-sheet-close"
          commands:
            - tapOn:
                id: "rest-sheet-close"
                waitToSettleTimeoutMs: 400
                optional: true
      - tapOn:
          id: "rest-bar-skip"
          waitToSettleTimeoutMs: 400
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-bar-skip"
          commands:
            - tapOn:
                id: "rest-bar-skip"
                waitToSettleTimeoutMs: 400
                optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      # Set 2: one tap on the row tick (or the thumb-zone button), rest a moment, skip.
      - tapOn:
          id: "exercise-0-set-1-check"
          waitToSettleTimeoutMs: 400
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "rest-bar"
            visible:
              id: "player-log"
          commands:
            - tapOn:
                id: "player-log"
                waitToSettleTimeoutMs: 400
                optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "rest-bar-skip"
          waitToSettleTimeoutMs: 400
          optional: true
      - runFlow:
          when:
            visible:
              id: "rest-bar-skip"
          commands:
            - tapOn:
                id: "rest-bar-skip"
                waitToSettleTimeoutMs: 400
                optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      # Finish (confirm: the other exercises are not done) → summary.
      - tapOn:
          id: "player-finish"
          waitToSettleTimeoutMs: 400
          optional: true
      - runFlow:
          when:
            visible:
              id: "finish-confirm"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "finish-confirm"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-summary"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 1300
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "summary-done"
          optional: true

      # ---------- Train: week strip, today's session, history ----------
      - extendedWaitUntil:
          visible:
            id: "tab-train"
          timeout: 20000
      - tapOn:
          id: "tab-train"
          optional: true
      # Retry once if the next screen has not appeared (a lost tap must not end the video).
      - extendedWaitUntil:
          visible:
            id: "train-week-strip"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "train-week-strip"
          commands:
            - tapOn:
                id: "tab-train"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "train-week-strip"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - evalScript: ${(function(){var d=new Date();var p=function(n){return (n<10?'0':'')+n};output.today=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());return output.today})()}
      - runFlow:
          when:
            visible:
              id: "day-${output.today}"
          commands:
            - tapOn:
                id: "day-${output.today}"
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "tour-pause"
                timeout: 900
                optional: true
            - tapOn:
                id: "day-${output.today}"
                optional: true
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
          duration: 1300
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - scrollUntilVisible:
          element:
            id: "train-tabs"
          direction: UP
          optional: true
      - tapOn:
          id: "train-tabs-history"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "history-0"
          timeout: 20000
          optional: true
      - extendedWaitUntil:
          visible:
            id: "tour-pause"
          timeout: 900
          optional: true
      - tapOn:
          id: "train-tabs-week"
          optional: true

      # ---------- Eat: rings, tick a meal, swap, recipe, cook mode, week ----------
      - tapOn:
          id: "tab-eat"
          optional: true
