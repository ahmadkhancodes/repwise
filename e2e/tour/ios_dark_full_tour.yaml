# Owner tour video (iOS, Dark Mode): ONE day in the life of a new Repwise user (D-TOUR-DAY, 23 Nov).
# Recorded by .github/workflows/record-ios-tour.yml (simctl recordVideo around this flow); the
# artifact `repwise-ios-dark-tour-natural` is the 1x cut with music, `freezes.txt` lists still runs > 4 s.
#
# Storyboard: welcome carousel → every onboarding step (US + UK cuisines) → building your plan →
# plan reveal scrolled → paywall (all 4 plans, X → Free) → MORNING Today dashboard → Train week
# (every session) + Routines + History → today's session preview (every exercise, 2 details) →
# Library (GIF scroll, Chest/Back/Quads, search "squat", 2 details) → BREAKFAST (recipe, tick, meal
# week) → WORKOUT (3 exercises × 2 sets, rests ~3 s, finish, summary) → LUNCH (tick, water ×2,
# ate-out screen) → PRO (dinner swap gate → paywall → test checkout → Payment complete → swap) →
# DINNER cook mode, every step → grocery list → EVENING Today → Progress (weight, recovery, charts)
# → weekly check-in → Settings + Subscription → Today.
#
# PACING (owner, 23 Nov): one steady speed. Every screen ~2 s (lib/go.yml), every scroll the same
# 900 ms swipe (lib/scroll.yml), waitForAnimationToEnd before taps, no still stretch over 4 s.
# Helpers live in e2e/tour/lib/*.yml (".yml", so scripts/ci/maestro-run.sh never runs them alone).
#
# Runs ONLY when TOUR_RECORDING=true; elsewhere it is a no-op. Needs the tour stub (STUB_URL) for marks.
appId: com.client.repwise
name: iOS dark-mode day-in-the-life tour (video)
tags:
  - tour
---
- runFlow:
    when:
      true: ${typeof TOUR_RECORDING !== 'undefined' && TOUR_RECORDING === 'true'}
    commands:
      - launchApp:
          clearState: true
          permissions:
            notifications: unset
      # Demo payments ON before onboarding ends, so the onboarding paywall and test checkout work.
      - runFlow:
          file: lib/open-link.yml
          env:
            LINK: repwise://demo-payments?on=1&reset=1

      # ================= 1. Welcome carousel =================
      - extendedWaitUntil:
          visible:
            id: "screen-welcome"
          timeout: 60000
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: start
      - waitForAnimationToEnd:
          timeout: 1500
      - repeat:
          times: 3
          commands:
            - runFlow: lib/pause.yml
            - swipe:
                from:
                  id: "welcome-carousel"
                direction: LEFT
                duration: 700
                optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: welcome-start
            EXPECT: screen-quiz-goal

      # ================= 2. Onboarding, every step =================
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: goal, PICK: option-fat_loss, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: about, PICK: option-male, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: body, PICK: none, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: target, PICK: target-set, NEXT: quiz-next }
      # Target step left open (target-set hidden): decide later.
      - runFlow:
          when:
            visible:
              id: "screen-quiz-target"
          commands:
            - tapOn:
                id: "quiz-next"
                optional: true
            - runFlow:
                when:
                  visible:
                    id: "screen-quiz-target"
                commands:
                  - tapOn:
                      id: "quiz-skip"
                      optional: true
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: experience, PICK: option-intermediate, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: days, PICK: days-count-4, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: length, PICK: option-60, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: equipment, PICK: option-gym, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: injuries, PICK: none, NEXT: quiz-skip }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: activity, PICK: option-moderate, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: diet, PICK: option-omnivore, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: avoid, PICK: dislikes-mushrooms, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: cuisines, PICK: cuisines-american, NEXT: none }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: cuisines, PICK: cuisines-british, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: kitchen, PICK: none, NEXT: quiz-next }
      - runFlow:
          file: lib/quiz.yml
          env: { STEP: meals, PICK: none, NEXT: quiz-next }
      # Reminders primer → the real iOS dialog → Allow.
      - extendedWaitUntil:
          visible:
            id: "screen-notify"
          timeout: 20000
      - runFlow: lib/pause.yml
      - tapOn:
          id: "notify-allow"
          optional: true
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 6000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
      - runFlow:
          when:
            visible:
              id: "screen-notify"
          commands:
            - tapOn:
                id: "notify-later"
                optional: true

      # ================= 3–4. Building your plan → plan reveal, scrolled to the bottom =================
      - extendedWaitUntil:
          visible:
            id: "reveal-targets"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow: lib/pause.yml
      - repeat:
          times: 5
          commands:
            - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: plan-continue
            EXPECT: screen-paywall

      # ================= 5. Paywall: all 4 plans, then X → Free =================
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-start
      - runFlow: lib/hold.yml
      - scrollUntilVisible:
          element:
            id: "plan-weekly"
          direction: DOWN
          centerElement: true
          timeout: 4000
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "plan-weekly"
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "plan-monthly"
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "plan-quarterly"
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "plan-yearly"
          optional: true
      - runFlow: lib/hold.yml
      - scrollUntilVisible:
          element:
            id: "paywall-close"
          direction: UP
          timeout: 3000
          optional: true
      - tapOn:
          id: "paywall-close"
          optional: true
      # Safety net: a checkout opened by a stray tap is cancelled, then the paywall closed.
      - runFlow:
          when:
            visible:
              id: "demo-checkout"
          commands:
            - tapOn:
                id: "demo-cancel"
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
            - tapOn:
                id: "paywall-close"
                optional: true
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-end

      # ================= 6. MORNING: Today dashboard =================
      - extendedWaitUntil:
          visible:
            id: "screen-today"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow: lib/pause.yml
      - repeat:
          times: 5
          commands:
            - runFlow: lib/scroll.yml
      - scrollUntilVisible:
          element:
            id: "today-date"
          direction: UP
          timeout: 6000
          optional: true

      # ================= 7. WEEKLY PLAN: Train week, every session, Routines, History =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: train
            EXPECT: screen-train
      - extendedWaitUntil:
          visible:
            id: "week-session-0"
          timeout: 15000
          optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/session.yml
          env: { I: 0 }
      - runFlow:
          file: lib/session.yml
          env: { I: 1 }
      - runFlow:
          file: lib/session.yml
          env: { I: 2 }
      - runFlow:
          file: lib/session.yml
          env: { I: 3 }
      - scrollUntilVisible:
          element:
            id: "train-tabs"
          direction: UP
          timeout: 6000
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "train-tabs-routines"
          optional: true
      - runFlow: lib/hold.yml
      - tapOn:
          id: "train-tabs-history"
          optional: true
      - runFlow: lib/hold.yml
      - tapOn:
          id: "train-tabs-week"
          optional: true
      - runFlow: lib/pause.yml

      # ================= 8. TODAY'S WORKOUT PLAN: every exercise, 2 details =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: today
            EXPECT: screen-today
      - runFlow:
          file: lib/go.yml
          env:
            TAP: workout-view
            EXPECT: player-overview
      # Rest day on Today (no View): open the first session of the week from Train instead.
      - runFlow:
          when:
            notVisible:
              id: "player-overview"
          commands:
            - runFlow:
                file: lib/tab.yml
                env:
                  TAB: train
                  EXPECT: screen-train
            - runFlow:
                file: lib/go.yml
                env:
                  TAP: week-session-0
                  EXPECT: player-overview
      - repeat:
          times: 4
          commands:
            - runFlow: lib/scroll.yml
      - scrollUntilVisible:
          element:
            id: "exercise-0-open"
          direction: UP
          timeout: 8000
          optional: true
      - runFlow:
          file: lib/go.yml
          env:
            TAP: exercise-0-open
            EXPECT: screen-exercise
      - runFlow: lib/hold.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: player-overview
      - runFlow:
          file: lib/go.yml
          env:
            TAP: exercise-1-open
            EXPECT: screen-exercise
      - runFlow: lib/hold.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: player-overview
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-today

      # ================= 9. LIBRARY: GIFs, Chest → Back → Quads, search "squat", 2 details =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: library
            EXPECT: screen-library
      - extendedWaitUntil:
          visible:
            id: "exercise-row-.*"
          timeout: 15000
          optional: true
      - runFlow: lib/pause.yml
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scroll.yml
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scrollup.yml
      - tapOn:
          id: "muscle-chip-chest"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scrollup.yml
      - tapOn:
          id: "muscle-chip-chest"
          optional: true
      - tapOn:
          id: "muscle-chip-back"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scrollup.yml
      - tapOn:
          id: "muscle-chip-back"
          optional: true
      - tapOn:
          id: "muscle-chip-quads"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scrollup.yml
      - tapOn:
          id: "muscle-chip-quads"
          optional: true
      - tapOn:
          id: "library-search"
          optional: true
      - inputText: "squat"
      - hideKeyboard
      - runFlow: lib/pause.yml
      - tapOn:
          id: "exercise-row-.*"
          index: 0
          optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-exercise"
          timeout: 10000
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow: lib/hold.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-library
      - tapOn:
          id: "exercise-row-.*"
          index: 1
          optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-exercise"
          timeout: 10000
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow: lib/hold.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-library

      # ================= 10. BREAKFAST: recipe, tick; the meal week =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: eat
            EXPECT: screen-eat
      - runFlow: lib/scroll.yml
      - runFlow: lib/scrollup.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: meal-breakfast
            EXPECT: screen-recipe
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-eat
      - scrollUntilVisible:
          element:
            id: "tick-breakfast"
          direction: DOWN
          centerElement: true
          timeout: 6000
          optional: true
      - tapOn:
          id: "tick-breakfast"
          optional: true
      - runFlow: lib/hold.yml
      - scrollUntilVisible:
          element:
            id: "eat-view"
          direction: UP
          timeout: 6000
          optional: true
      - tapOn:
          id: "eat-view-week"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "week-days"
          timeout: 10000
          optional: true
      - runFlow: lib/pause.yml
      - repeat:
          times: 4
          commands:
            - runFlow: lib/scroll.yml
      - scrollUntilVisible:
          element:
            id: "eat-view"
          direction: UP
          timeout: 8000
          optional: true
      - tapOn:
          id: "eat-view-day"
          optional: true
      - runFlow: lib/pause.yml

      # ================= 11. WORKOUT: 3 exercises × 2 sets, rests, finish, summary =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: today
            EXPECT: screen-today
      - runFlow:
          file: lib/go.yml
          env:
            TAP: start-workout
            EXPECT: screen-workout
      - runFlow:
          when:
            notVisible:
              id: "screen-workout"
          commands:
            - runFlow:
                file: lib/tab.yml
                env:
                  TAB: train
                  EXPECT: screen-train
            - runFlow:
                file: lib/go.yml
                env:
                  TAP: train-start
                  EXPECT: screen-workout
      - runFlow:
          when:
            visible:
              id: "player-start"
          commands:
            - waitForAnimationToEnd:
                timeout: 1500
            - tapOn:
                id: "player-start"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "player-clock"
          timeout: 20000
      - runFlow: lib/hold.yml
      - runFlow:
          file: lib/set.yml
          env: { E: 0, S: 0 }
      - runFlow:
          file: lib/set.yml
          env: { E: 0, S: 1 }
      - runFlow:
          file: lib/set.yml
          env: { E: 0, S: 2 }
      - runFlow:
          file: lib/set.yml
          env: { E: 1, S: 0 }
      - runFlow:
          file: lib/set.yml
          env: { E: 1, S: 1 }
      - runFlow:
          file: lib/set.yml
          env: { E: 2, S: 0 }
      - runFlow:
          file: lib/set.yml
          env: { E: 2, S: 1 }
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scroll.yml
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "player-finish"
          waitToSettleTimeoutMs: 500
          optional: true
      - extendedWaitUntil:
          visible:
            id: "finish-confirm"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible:
              id: "finish-confirm"
          commands:
            - runFlow: lib/pause.yml
            - tapOn:
                id: "finish-confirm"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-summary"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow: lib/hold.yml
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - tapOn:
          id: "summary-done"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500

      # ================= 12. LUNCH: tick, water ×2, ate-out screen =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: eat
            EXPECT: screen-eat
      - scrollUntilVisible:
          element:
            id: "tick-lunch"
          direction: DOWN
          centerElement: true
          timeout: 6000
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "tick-lunch"
          optional: true
      - runFlow: lib/pause.yml
      - scrollUntilVisible:
          element:
            id: "add-water"
          direction: DOWN
          centerElement: true
          timeout: 6000
          optional: true
      - tapOn:
          id: "add-water"
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "add-water"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: open-log
            EXPECT: screen-log
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-eat

      # ================= 13. PRO MOMENT: dinner swap → gate → paywall → test checkout =================
      - scrollUntilVisible:
          element:
            id: "swap-dinner"
          direction: UP
          centerElement: true
          timeout: 6000
          optional: true
      - scrollUntilVisible:
          element:
            id: "swap-dinner"
          direction: DOWN
          centerElement: true
          timeout: 6000
          optional: true
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-start
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "swap-dinner"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "gate-title"
          timeout: 10000
          optional: true
      - runFlow: lib/hold.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: gate-cta
            EXPECT: screen-paywall
      - runFlow: lib/pause.yml
      - tapOn:
          id: "plan-yearly"
          optional: true
      - runFlow: lib/pause.yml
      - waitForAnimationToEnd:
          timeout: 1500
      - tapOn:
          id: "paywall-cta"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "demo-checkout"
          timeout: 10000
          optional: true
      - runFlow: lib/hold.yml
      - tapOn:
          id: "demo-confirm"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "demo-payment-complete"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "demo-payment-complete"
          commands:
            - tapOn:
                text: "Confirm"
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "demo-payment-complete"
                timeout: 10000
                optional: true
      - runFlow: lib/hold.yml
      - tapOn:
          id: "demo-continue"
          optional: true
      - runFlow:
          when:
            visible:
              id: "demo-payment-complete"
          commands:
            - tapOn:
                text: "Continue"
                optional: true
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-end
      # Pro now: the swap opens the options; pick the first (American/British by default).
      - extendedWaitUntil:
          visible:
            id: "screen-eat"
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: "swap-sheet"
          commands:
            - scrollUntilVisible:
                element:
                  id: "swap-dinner"
                direction: DOWN
                centerElement: true
                timeout: 6000
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
            - tapOn:
                id: "swap-dinner"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "swap-option-0"
          timeout: 15000
          optional: true
      - runFlow: lib/hold.yml
      - tapOn:
          id: "swap-option-0"
          optional: true
      - runFlow:
          when:
            visible:
              id: "swap-sheet-close"
          commands:
            - tapOn:
                id: "swap-sheet-close"
                optional: true
      - runFlow: lib/pause.yml

      # ================= 14. DINNER: recipe → cook mode, every step =================
      - runFlow:
          file: lib/go.yml
          env:
            TAP: meal-dinner
            EXPECT: screen-recipe
      - runFlow: lib/scroll.yml
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: start-cook
            EXPECT: screen-cook
      - repeat:
          while:
            visible:
              id: "cook-next"
          times: 12
          commands:
            - runFlow: lib/pause.yml
            - tapOn:
                id: "cook-next"
                waitToSettleTimeoutMs: 500
                optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "cook-done"
          optional: true
      - runFlow:
          when:
            visible:
              id: "screen-cook"
          commands:
            - tapOn:
                id: "cook-close"
                optional: true
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-eat

      # ================= 15. Grocery list (Pro) =================
      - scrollUntilVisible:
          element:
            id: "open-grocery"
          direction: UP
          timeout: 6000
          optional: true
      - runFlow:
          file: lib/go.yml
          env:
            TAP: open-grocery
            EXPECT: screen-grocery
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-eat

      # ================= 16. EVENING: Today → Progress → weekly check-in =================
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: today
            EXPECT: screen-today
      - scrollUntilVisible:
          element:
            id: "today-date"
          direction: UP
          timeout: 6000
          optional: true
      - runFlow: lib/pause.yml
      - repeat:
          times: 4
          commands:
            - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/tab.yml
          env:
            TAB: progress
            EXPECT: screen-progress
      - runFlow:
          file: lib/go.yml
          env:
            TAP: progress-log-weight
            EXPECT: screen-progress-log
      - tapOn:
          id: "log-day-today"
          optional: true
      - tapOn:
          id: "log-weight"
          optional: true
      - inputText: "82.4"
      - runFlow: lib/pause.yml
      - tapOn:
          id: "log-save"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-progress"
          timeout: 10000
          optional: true
      - runFlow: lib/pause.yml
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: nav-heatmap
            EXPECT: screen-progress-heatmap
      - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-progress
      - runFlow:
          file: lib/go.yml
          env:
            TAP: nav-trends
            EXPECT: screen-progress-trends
      - repeat:
          times: 3
          commands:
            - runFlow: lib/scroll.yml
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-progress
      # Weekly check-in, opened by its reminder link like the notification.
      - runFlow:
          file: lib/open-link.yml
          env:
            LINK: repwise://today?checkin=1
      - extendedWaitUntil:
          visible:
            id: "checkin-progress"
          timeout: 15000
          optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          when:
            visible:
              id: "checkin-skip-weight"
          commands:
            - tapOn:
                id: "checkin-skip-weight"
                optional: true
      - runFlow:
          when:
            visible:
              id: "checkin-step-weigh"
          commands:
            - tapOn:
                id: "checkin-next"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "energy-ok"
          timeout: 10000
          optional: true
      - runFlow: lib/pause.yml
      - tapOn:
          id: "energy-ok"
          optional: true
      - tapOn:
          id: "sleep-good"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: checkin-next
            EXPECT: checkin-summary
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: checkin-next
            EXPECT: checkin-volume
      - tapOn:
          id: "checkin-approve"
          optional: true
      - runFlow: lib/pause.yml
      - runFlow:
          file: lib/go.yml
          env:
            TAP: checkin-finish
            EXPECT: screen-today

      # ================= 17. Settings, Subscription → end on Today =================
      - scrollUntilVisible:
          element:
            id: "open-settings"
          direction: UP
          timeout: 6000
          optional: true
      - runFlow:
          file: lib/go.yml
          env:
            TAP: open-settings
            EXPECT: screen-settings
      - repeat:
          times: 5
          commands:
            - runFlow: lib/scroll.yml
      - scrollUntilVisible:
          element:
            id: "open-subscription"
          direction: UP
          centerElement: true
          timeout: 10000
          optional: true
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-start
      - runFlow:
          file: lib/go.yml
          env:
            TAP: open-subscription
            EXPECT: screen-subscription
      - runFlow:
          when:
            notVisible:
              id: "screen-subscription"
          commands:
            - tapOn:
                text: "Subscription"
                optional: true
            - extendedWaitUntil:
                visible:
                  id: "screen-subscription"
                timeout: 10000
                optional: true
      - runFlow: lib/hold.yml
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: keep-end
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-settings
      - runFlow:
          file: lib/back.yml
          env:
            EXPECT: screen-today
      - runFlow:
          when:
            notVisible:
              id: "screen-today"
          commands:
            - tapOn:
                id: "tab-today"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "screen-today"
          timeout: 20000
      - runFlow: lib/hold.yml
      - runFlow:
          file: lib/mark.yml
          env:
            NAME: end
