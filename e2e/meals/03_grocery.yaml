# RW-36 / W7: the week's grocery list by aisle, tick off, share as text.
# Precondition: onboarding saved a profile (run the onboarding flow first). testIDs render on iOS and Android.
appId: com.client.repwise
---
- launchApp
- tapOn:
    id: "tab-eat"
- extendedWaitUntil:
    visible:
      id: "meal-lunch"
    timeout: 15000
- tapOn:
    id: "open-grocery"
- extendedWaitUntil:
    visible:
      id: "grocery-left"
    timeout: 10000
- tapOn:
    id: "grocery-item-.*"
    index: 0
- assertVisible:
    id: "grocery-clear"
- tapOn:
    id: "grocery-clear"
- assertVisible:
    id: "grocery-share"
- tapOn:
    id: "back"
