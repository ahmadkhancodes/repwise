# RW-34 "I ate out" with rebalance, RW-38 water quick add.
# Precondition: onboarding saved a profile (run the onboarding flow first). testIDs render on iOS and Android.
appId: com.client.repwise
---
- launchApp
- tapOn:
    id: "tab-eat"
- extendedWaitUntil:
    visible:
      id: "meal-lunch"
    timeout: 15000
- tapOn:
    id: "open-log"
- tapOn:
    id: "log-slot-lunch"
- tapOn:
    id: "estimate-regular"
- tapOn:
    id: "log-out-save"
- assertVisible: "Meal out logged.*"
- tapOn:
    id: "open-water"
- tapOn:
    id: "water-add"
- assertVisible:
    id: "water-entries"
- tapOn:
    id: "back"
- tapOn:
    id: "eat-rings"
- assertVisible:
    id: "day-log-items"
