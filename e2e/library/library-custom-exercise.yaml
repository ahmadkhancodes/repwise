# P1 (RW-28, S19): create a custom exercise, find it in the library, delete it.
appId: com.client.repwise
tags:
  - library
---
- launchApp
- tapOn:
    id: tab-library
- tapOn:
    id: library-create
- assertVisible: New exercise
- tapOn:
    id: custom-name
- inputText: Maestro landmine row
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    # Maestro's hideKeyboard fails on iOS; the name field's return key closes it.
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- tapOn:
    id: custom-primary-lats
- scrollUntilVisible:
    element:
      id: custom-equipment-landmine
    direction: DOWN
    centerElement: true
- tapOn:
    id: custom-equipment-landmine
- tapOn:
    id: custom-save
- assertVisible:
    id: screen-exercise
- assertVisible: Maestro landmine row
- tapOn:
    id: exercise-back
- tapOn:
    id: library-search
- inputText: maestro landmine
- assertVisible: Yours
# The result row is one accessible element; on iOS its label is the whole row
# ("Maestro landmine row, your exercise, Lats · Landmine"), so match the start of it.
- tapOn: "Maestro landmine row.*"
- tapOn:
    id: exercise-edit
- scrollUntilVisible:
    element:
      id: custom-delete
    direction: DOWN
    # The edit form is 4 screens tall; on the iOS simulator each swipe + hierarchy read takes
    # ~3 s, so Maestro's 20 s default ran out one swipe short of the button.
    timeout: 60000
- tapOn:
    id: custom-delete
- tapOn:
    id: custom-delete-confirm
- assertVisible:
    id: screen-library
