# P0 (RW-27, S18): filter by muscle and equipment from the sheet, clear from the chip rail, then a one-tap muscle chip.
appId: com.client.repwise
tags:
  - library
  - p0
---
- launchApp
- tapOn:
    id: tab-library
- tapOn:
    id: library-search-filters
- assertVisible: Filters
- tapOn:
    id: filter-muscle-chest
- tapOn:
    id: filter-equipment-dumbbell
- tapOn:
    id: filter-apply
- assertVisible: Results
- assertVisible:
    id: active-filter-e:dumbbell
- tapOn:
    id: muscle-chip-chest
- tapOn:
    id: active-filter-e:dumbbell
- assertVisible: All exercises
# One-tap muscle chip, then clear it.
- tapOn:
    id: muscle-chip-back
- assertVisible: Results
- tapOn:
    id: muscle-chip-back
- assertVisible: All exercises
