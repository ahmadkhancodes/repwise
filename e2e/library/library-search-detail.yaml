# P0 (RW-27, S18 → S19): search the library, open an exercise, favourite it.
# Runs on iOS and Android: testIDs map to accessibilityIdentifier / resource-id.
appId: com.client.repwise
tags:
  - library
  - p0
---
- launchApp
- tapOn:
    id: tab-library
- assertVisible:
    id: screen-library
- tapOn:
    id: library-search
- inputText: back squat
- tapOn:
    id: exercise-row-barbell-back-squat
- assertVisible:
    id: screen-exercise
- assertVisible: Barbell back squat
# Hero = animated ExerciseDB demo (GIF from our CDN); offline it is the muscle map, so the flow
# only asserts the hero box. The muscle map lives under "Muscles worked" (secondary visual):
# its spoken label starts with the name, then the side, and it turns with its flip button.
- assertVisible:
    id: exercise-media
- scrollUntilVisible:
    element:
      id: exercise-muscles-map-flip
    direction: DOWN
    centerElement: true
- assertVisible: Muscles worked
- tapOn:
    id: exercise-muscles-map-flip
- assertVisible:
    text: Barbell back squat\. Back view\..*
- scrollUntilVisible:
    element: How to do it
    direction: DOWN
    centerElement: true
- tapOn:
    id: exercise-favourite
- tapOn:
    id: exercise-back
- tapOn:
    id: library-search-clear
- hideKeyboard
- assertVisible: Favourites
- assertVisible: Recently used
# The full ExerciseDB library: a browse-only V1 exercise opens with its demo and steps, and
# cannot be added to a workout (the planner uses only the curated set).
- tapOn:
    id: library-search
- inputText: guillotine
- tapOn:
    id: exercise-row-exercisedb-GXoaSgn
- assertVisible:
    id: exercise-browse-only
- assertVisible:
    id: exercise-media
- assertNotVisible:
    id: exercise-add
- tapOn:
    id: exercise-back
