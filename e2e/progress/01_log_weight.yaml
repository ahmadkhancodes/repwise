# P0 (RW-38 + RW-50, S29 -> S30 add): log today's weight in two taps, then see it on Body.
# Units follow the profile (kg or lb), so the flow types a value valid in both.
appId: com.client.repwise
tags:
  - progress
  - p0
---
- launchApp
- tapOn:
    id: tab-progress
- assertVisible:
    id: screen-progress
- tapOn:
    id: progress-log-weight
- assertVisible:
    id: screen-progress-log
- tapOn:
    id: log-day-today
- tapOn:
    id: log-weight
- inputText: '82.4'
- runFlow:
    # Maestro cannot hide the iOS keyboard without a return key; Android only (Save sits above the keyboard).
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: log-save
- assertVisible: Weight saved
- assertVisible:
    id: screen-progress
# The weight tile sits under the calendar.
- scrollUntilVisible:
    element:
      id: nav-body
    direction: DOWN
- tapOn:
    id: nav-body
- assertVisible:
    id: screen-progress-body
- assertVisible:
    id: weight-current
- assertVisible:
    id: weight-chart
- tapOn:
    id: body-tab-measurements
- tapOn:
    id: body-tab-weight
- tapOn:
    id: back
- assertVisible:
    id: screen-progress
