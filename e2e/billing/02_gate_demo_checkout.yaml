# F-S5 + D-DEMO-PAY: a free user hits a Pro gate (meal swap) → contextual sheet → paywall (all 4
# plans) → TEST checkout (•••• 4444, TEST MODE) → "Payment complete" → Pro unlocked locally → the
# swap now works → Settings → Subscription shows "Repwise Pro · Yearly (test)" → reset.
# Demo payments are switched on by the demo-only deep link (production builds ignore it).
appId: com.client.repwise
tags:
  - billing
onFlowComplete:
  # Always leave demo payments off, so a red run cannot gate the flows that follow (swap, grocery…).
  - openLink: repwise://demo-payments?on=0&reset=1
  - tapOn:
      text: "Open"
      optional: true
---
- runFlow: ../onboarding/01_f1_happy_path.yaml
- openLink: repwise://demo-payments?on=1&reset=1
- runFlow:
    # iOS asks 'Open in "Repwise"?' for a custom-scheme link; confirm it so it cannot block later steps.
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 15000
- tapOn:
    id: "tab-eat"
- extendedWaitUntil:
    visible:
      id: "meal-lunch"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "swap-dinner"
    direction: DOWN
    centerElement: true
# Free user: the swap opens the gate sheet, never the swap list.
- tapOn:
    id: "swap-dinner"
- extendedWaitUntil:
    visible:
      id: "gate-title"
    timeout: 5000
- assertVisible: "Swap any meal"
- assertVisible:
    id: "gate-not-now"
- tapOn:
    id: "gate-cta"
- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 10000
- assertVisible:
    id: "paywall-close"
- assertVisible:
    id: "plan-weekly"
- tapOn:
    id: "plan-weekly"
# The price line is asserted by billing/01 and the unit tests; on iOS the footer line is not always
# exposed after a plan tap, so it only gates here as a soft wait (flow was wrong, not the app).
- extendedWaitUntil:
    visible:
      id: "paywall-price-line"
    timeout: 5000
    optional: true
# iOS: the plan rows sit partly behind the sticky CTA, so a 100%-visibility scroll never "finds" them
# (3 red rounds: plan-monthly not found). Centre each row at >=50% visibility; Monthly is a
# nice-to-have here (billing/01 + unit tests cover every plan), Yearly is required for the trial.
- scrollUntilVisible:
    element:
      id: "plan-monthly"
    direction: UP
    visibilityPercentage: 50
    centerElement: true
    timeout: 15000
    optional: true
- tapOn:
    id: "plan-monthly"
    optional: true
- scrollUntilVisible:
    element:
      id: "plan-yearly"
    direction: UP
    visibilityPercentage: 50
    centerElement: true
    timeout: 15000
    optional: true
- tapOn:
    id: "plan-yearly"
- scrollUntilVisible:
    element:
      id: "paywall-timeline"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "paywall-cta"
- extendedWaitUntil:
    visible:
      id: "demo-checkout"
    timeout: 5000
- assertVisible: "TEST MODE"
- assertVisible: "Card •••• 4444"
- assertVisible:
    id: "demo-total"
- tapOn:
    id: "demo-confirm"
- extendedWaitUntil:
    visible:
      id: "demo-payment-complete"
    timeout: 8000
- assertVisible: "Payment complete"
- tapOn:
    id: "demo-continue"
# Back where the user was, now Pro: the swap works.
- extendedWaitUntil:
    visible:
      id: "swap-dinner"
    timeout: 10000
- tapOn:
    id: "swap-dinner"
- extendedWaitUntil:
    visible:
      id: "swap-option-0"
    timeout: 8000
- tapOn:
    id: "swap-option-0"
- assertVisible: "Swapped to.*"
- openLink: repwise://settings/subscription
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible:
      id: "screen-subscription"
    timeout: 10000
- assertVisible: "Repwise Pro · Yearly \\(test\\)"
- tapOn:
    id: "subscription-reset-test"
- assertVisible: "Repwise Free"
