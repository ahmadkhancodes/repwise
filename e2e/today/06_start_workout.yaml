# P0 (F-today → S13): on a training day, Start workout leaves Today for the workout player in one
# tap (deep link /train?sessionId=<id>&start=1: Train starts the session and opens the player);
# the player's own close button returns (no Maestro `back`: it is a no-op on iOS), then the Today tab.
# Skips itself on a rest day.
# Precondition: onboarding finished with a training plan. iOS and Android.
appId: com.client.repwise
tags:
  - today
  - p0
---
- launchApp
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "today-rest"
    commands:
      - assertNotVisible:
          id: "start-workout"
- runFlow:
    when:
      visible:
        id: "start-workout"
    commands:
      - assertVisible:
          id: "workout-title"
      - tapOn:
          id: "start-workout"
      - extendedWaitUntil:
          visible:
            id: "screen-workout"
          timeout: 10000
      - assertVisible:
          id: "player-close"
      - tapOn:
          id: "player-close"
      - extendedWaitUntil:
          notVisible:
            id: "screen-workout"
          timeout: 5000
      - tapOn:
          id: "tab-today"
      - extendedWaitUntil:
          visible:
            id: "screen-today"
          timeout: 5000
