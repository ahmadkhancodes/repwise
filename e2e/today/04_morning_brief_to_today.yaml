# P0 (F-today, N-1): the morning brief notification opens Today (data.url '/today'). The tap is
# simulated with the same deep link the notification handler navigates to, on a cold start.
# Precondition: onboarding finished (run the onboarding flow first). iOS and Android.
appId: com.client.repwise
tags:
  - today
  - p0
---
- launchApp
- stopApp
- openLink: repwise://today
- runFlow:
    # iOS asks 'Open in "Repwise"?' for a custom-scheme link; confirm it so it cannot block later steps.
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Open"
          optional: true
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 15000
- assertVisible:
    id: "today-date"
# Home dashboard (owner 22 Nov): the brief card was replaced by the workout hero + stats grid,
# so this flow now checks the dashboard the notification opens onto.
- scrollUntilVisible:
    element:
      id: "stat-calories"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "stat-calories"
# Steps never prompt at launch: "Turn on steps" (or "Not on this phone" on a simulator).
- scrollUntilVisible:
    element:
      id: "stat-steps(-enable)?"
    direction: DOWN
    centerElement: true
