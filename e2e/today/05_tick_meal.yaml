# P0 (P5 core action): tick a planned meal on Today in one tap; the count updates, the toast offers
# Undo for 5 s, and Undo restores it. Meals are planned offline by the meals domain on first open.
# Precondition: onboarding finished (run the onboarding flow first). iOS and Android.
appId: com.client.repwise
tags:
  - today
  - p0
---
- launchApp
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible:
      id: "screen-today"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "today-meals"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: "today-meal-lunch"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: "meals-count"
    text: "0 of .* eaten"
- scrollUntilVisible:
    element:
      id: "today-tick-lunch"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "today-tick-lunch"
# The Undo toast lasts 5 s and each assertion costs seconds on a CI simulator, so tap Undo straight
# after the tick (it also proves the tick logged); the count assertion after it proves the restore.
- tapOn: "Undo"
- assertVisible:
    id: "meals-count"
    text: "0 of .* eaten"
