# P0 (RW-43, P-N1, S38 → Notifications): permission, toggles, a time picker, quiet hours.
# Runs on iOS and Android (testIDs only; the OS permission is pre-granted).
appId: com.client.repwise
tags:
  - notifications
---
- launchApp:
    permissions:
      notifications: allow
- tapOn:
    id: open-settings
- tapOn:
    id: open-notifications
- assertVisible:
    id: screen-notifications
- runFlow:
    # Granted by launchApp on Android; the iOS simulator does not always apply the grant.
    when:
      platform: Android
    commands:
      - assertNotVisible:
          id: turn-on
- assertVisible: Morning brief
- tapOn:
    id: toggle-meals
- tapOn:
    id: toggle-meals
- scrollUntilVisible:
    element:
      id: time-workout
    direction: DOWN
    centerElement: true
- tapOn:
    id: time-workout
- assertVisible:
    id: time-save
- tapOn:
    id: time-save
- scrollUntilVisible:
    element:
      id: time-quiet-start
    direction: DOWN
    centerElement: true
- tapOn:
    id: toggle-quiet
- assertNotVisible:
    id: time-quiet-start
- tapOn:
    id: toggle-quiet
- assertVisible:
    id: time-quiet-start
