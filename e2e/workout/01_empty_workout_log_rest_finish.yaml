# P0 workout (F2 "Do the planned workout", WK-1..WK-6): start a workout, add an exercise,
# log sets with 1 tap each, the rest timer, finish and the summary. Runs fully OFFLINE:
# airplane mode on Android (Maestro can't toggle it on iOS; the flow is identical there).
# Precondition: onboarding done, no workout in progress. testIDs render on iOS and Android.
appId: com.client.repwise
name: Workout - start, 1-tap sets, rest timer, finish, summary (offline)
tags:
  - workout
  - p0
---
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- tapOn:
    id: "tab-train"
- assertVisible:
    id: "screen-train"
# One tap: "Start workout" (today's plan) or "Start empty workout" (rest day / no plan).
- tapOn:
    id: "train-start"
- extendedWaitUntil:
    visible:
      id: "screen-workout"
    timeout: 10000
- assertVisible:
    id: "player-clock"
# Empty workout: add an exercise from the bundled catalogue (no network needed).
- runFlow:
    when:
      visible:
        id: "player-empty"
    commands:
      - tapOn:
          id: "player-empty-action"
      - assertVisible:
          id: "screen-pick"
      - tapOn:
          id: "pick-search"
      - inputText: "bench press"
      - tapOn:
          id: "pick-barbell-bench-press"
      - assertVisible: ".*added"
- extendedWaitUntil:
    visible:
      id: "exercise-0-set-0-check"
    timeout: 5000
# Set 1: enter weight and reps (strength rows), then one tap to log it.
- runFlow:
    when:
      visible:
        id: "exercise-0-set-0-weight"
    commands:
      - tapOn:
          id: "exercise-0-set-0-weight"
      - eraseText
      - inputText: "60"
      - tapOn:
          id: "exercise-0-set-0-reps"
      - eraseText
      - inputText: "8"
      - hideKeyboard
- tapOn:
    id: "exercise-0-set-0-check"
# The rest timer starts on its own; open it, add 15 s, then skip.
- extendedWaitUntil:
    visible:
      id: "rest-pill"
    timeout: 3000
- assertVisible:
    id: "rest-pill-time"
- tapOn:
    id: "rest-pill"
- assertVisible:
    id: "rest-sheet-time"
- tapOn:
    id: "rest-plus"
- tapOn:
    id: "rest-skip"
- assertNotVisible:
    id: "rest-pill"
# Set 2: one tap.
- tapOn:
    id: "exercise-0-set-1-check"
- assertVisible:
    id: "rest-pill"
# Finish; confirm only when some sets are still unticked.
- tapOn:
    id: "player-finish"
- runFlow:
    when:
      visible:
        id: "finish-confirm"
    commands:
      - tapOn:
          id: "finish-confirm"
- extendedWaitUntil:
    visible:
      id: "screen-summary"
    timeout: 5000
- assertVisible: "Workout done"
- assertVisible:
    id: "summary-volume"
- tapOn:
    id: "summary-done"
- assertVisible:
    id: "screen-train"
- tapOn: "History"
- assertVisible:
    id: "history-0"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
