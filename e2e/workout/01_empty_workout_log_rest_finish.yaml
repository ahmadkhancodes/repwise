# P0 workout (F2 "Do the planned workout", WK-1..WK-6): start a workout, add an exercise,
# set values with the gym stepper editor, log sets with 1 tap each (row tick and the thumb-zone
# "Log set" button), the rest bar (+15 / big timer / skip), finish and the summary. Runs fully OFFLINE:
# airplane mode on Android (Maestro can't toggle it on iOS; the flow is identical there).
# Precondition: onboarding done, no workout in progress. testIDs render on iOS and Android.
appId: com.client.repwise
name: Workout - start, 1-tap sets, rest timer, finish, summary (offline)
tags:
  - workout
  - p0
---
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- tapOn:
    id: "tab-train"
- assertVisible:
    id: "screen-train"
# One tap: "Start workout" (today's plan) or "Start empty workout" (rest day / no plan).
- tapOn:
    id: "train-start"
- extendedWaitUntil:
    visible:
      id: "screen-workout"
    timeout: 10000
- assertVisible:
    id: "player-clock"
# Empty workout: add an exercise from the bundled catalogue (no network needed).
- runFlow:
    when:
      visible:
        id: "player-empty"
    commands:
      - tapOn:
          id: "player-empty-action"
      - assertVisible:
          id: "screen-pick"
      - tapOn:
          id: "pick-search"
      - inputText: "bench press"
      - tapOn:
          id: "exercise-row-barbell-bench-press"
      - assertVisible: ".*added"
- extendedWaitUntil:
    visible:
      id: "exercise-0-set-0-check"
    timeout: 5000
# Set 1: set weight and reps with the stepper editor (no keyboard), then log from it.
- tapOn:
    id: "exercise-0-set-0-weight"
- assertVisible:
    id: "set-editor-weight"
- tapOn:
    id: "set-editor-weight-inc"
- tapOn:
    id: "set-editor-weight-inc"
- tapOn:
    id: "set-editor-reps-inc"
- tapOn:
    id: "set-editor-log"
# The rest bar appears on its own: +15 inline, open the big timer, then skip.
- extendedWaitUntil:
    visible:
      id: "rest-bar"
    timeout: 3000
- assertVisible:
    id: "rest-bar-time"
- tapOn:
    id: "rest-bar-plus"
- tapOn:
    id: "rest-bar-open"
- assertVisible:
    id: "rest-time"
- tapOn:
    id: "rest-plus"
- tapOn:
    id: "rest-skip"
- assertNotVisible:
    id: "rest-bar"
# Set 2: one tap on the row tick; set 3: one tap on the thumb-zone "Log set" button.
- tapOn:
    id: "exercise-0-set-1-check"
- assertVisible:
    id: "rest-bar"
- tapOn:
    id: "rest-bar-skip"
- runFlow:
    when:
      visible:
        id: "player-log"
    commands:
      - tapOn:
          id: "player-log"
# Finish; confirm only when some sets are still unticked.
- tapOn:
    id: "player-finish"
- runFlow:
    when:
      visible:
        id: "finish-confirm"
    commands:
      - tapOn:
          id: "finish-confirm"
- extendedWaitUntil:
    visible:
      id: "screen-summary"
    timeout: 5000
- assertVisible: "Workout done"
- assertVisible:
    id: "summary-volume"
- tapOn:
    id: "summary-done"
- assertVisible:
    id: "screen-train"
- tapOn: "History"
- assertVisible:
    id: "history-0"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
