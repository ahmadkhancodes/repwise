name: E2E iOS

# Device QA on an iOS simulator: prebuild in CI → pod install → unsigned Release simulator build
# (JS bundled, no Metro) → iPhone 16-class simulator → the same Maestro flows as Android.
# Android-only steps are gated in the flows with `runFlow: when: platform: Android`; flows that
# cannot run on iOS are skipped by scripts/ci/maestro-run.sh (IOS_SKIP). How to run it: docs/QA.md.
on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flows: "all", or comma-separated parts of paths in e2e/ (e.g. "today,meals/03")'
        type: string
        default: all
      maestro_version:
        description: Maestro CLI version (empty = latest)
        type: string
        default: ''
      simulator:
        description: Simulator name to prefer (empty = iPhone 16, else the closest iPhone 16/17)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  # Builds without secrets (docs/QA.md): no EXPO_PUBLIC_* values, so the app runs offline with the
  # rules-only planner; no EAS project id; the Google Sign-In plugin is skipped (no URL scheme).
  EAS_PROJECT_ID: ''
  GOOGLE_IOS_URL_SCHEME: ''
  EXPO_PUBLIC_API_URL: ''
  DERIVED_DATA: ios/build

jobs:
  ios:
    name: Simulator build + Maestro
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4 # Maestro CLI runs on the JVM
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prebuild iOS (never committed)
        run: npx expo prebuild -p ios --no-install --clean

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: pod install || pod install --repo-update

      - name: Pick an iPhone 16-class simulator
        id: sim
        env:
          SIM_NAME: ${{ inputs.simulator }}
        run: echo "udid=$(node scripts/ci/ios-sim.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build Release for the simulator (unsigned)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          mkdir -p e2e-artifacts/logs
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee e2e-artifacts/logs/xcodebuild.log | \
            { if command -v xcbeautify >/dev/null; then xcbeautify --quiet; else grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)' || true; fi; }
          APP="$DERIVED_DATA/Build/Products/Release-iphonesimulator/$SCHEME.app"
          test -d "$APP" || { echo "::error::No app at $APP"; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: repwise-ios-simulator-app
          path: ${{ env.APP_PATH }}
          retention-days: 7

      - name: Boot the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Calm, deterministic UI for screenshots.
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true

      - name: Install Maestro
        env:
          WANTED_VERSION: ${{ inputs.maestro_version }}
        run: |
          if [ -n "$WANTED_VERSION" ]; then export MAESTRO_VERSION="$WANTED_VERSION"; fi
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
          # launchApp `permissions:` on iOS uses applesimutils when it is present.
          brew tap wix/brew >/dev/null && brew install applesimutils >/dev/null || echo "applesimutils not installed"

      - name: Run Maestro flows on the simulator
        env:
          FLOWS: ${{ inputs.flows }}
          DEVICE: ${{ steps.sim.outputs.udid }}
          OUT_DIR: e2e-artifacts
          MAESTRO_CLI_NO_ANALYTICS: '1'
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
        run: bash scripts/ci/maestro-run.sh ios

      - name: Upload screenshots, JUnit and device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-results
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
